<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes pulse-glow {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    
    .floating-node { animation: float 4s ease-in-out infinite; }
    .pulse-bg { animation: pulse-glow 3s ease-in-out infinite; }
    .data-stream { stroke-dasharray: 8 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>

  <!-- Glowing background elements -->
  <circle cx="600" cy="160" r="280" fill="url(#glow)" class="pulse-bg"/>

  <!-- Dynamic / Animated Background Network Graph & Flow Lines (Behind text layer) -->
  <g stroke="rgba(255,255,255,0.12)" stroke-width="1.5" fill="none">
    <path d="M 100 80 Q 300 240 600 160 T 1100 220" />
    <path d="M 50 220 Q 400 40 800 260 T 1150 100" />
    <path d="M 200 280 L 400 60 L 700 250 L 1000 80" class="data-stream" stroke="#818cf8" stroke-opacity="0.4"/>
  </g>

  <!-- Dynamic Animated Nodes (Background layer) -->
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="200" cy="280" r="5"/>
    <circle cx="400" cy="60" r="7" class="floating-node"/>
    <circle cx="700" cy="250" r="6"/>
    <circle cx="1000" cy="80" r="8" class="floating-node"/>
  </g>

  <!-- Title & Subtitle Foreground Group (Guaranteed High Contrast & Readability) -->
  <g transform="translate(600, 125)" text-anchor="middle">
    <!-- Top Pill Badge -->
    <g transform="translate(0, -60)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text y="5" text-anchor="middle" class="badge-text">☁️ CLOUD ROBOTICS &amp; SIMULATION 🤖</text>
    </g>

    <!-- Main Title -->
    <text y="15" class="title">Awesome Cloud Robotics Simulation</text>
    
    <!-- Subtitle -->
    <text y="55" class="subtitle">Curated Directory of Cloud Simulators, Fleet Management &amp; Robot Learning Frameworks</text>

    <!-- Bottom Feature Tags -->
    <g transform="translate(0, 105)">
      <!-- Tag 1 -->
      <g transform="translate(-210, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="8" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
        <text y="4" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8">NVIDIA Isaac Sim</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(0, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="8" fill="rgba(129, 140, 248, 0.15)" stroke="#818cf8" stroke-width="1"/>
        <text y="4" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#818cf8">ROS 2 &amp; Gazebo</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(210, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="8" fill="rgba(192, 132, 252, 0.15)" stroke="#c084fc" stroke-width="1"/>
        <text y="4" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#c084fc">Foxglove &amp; RobOps</text>
      </g>
    </g>
  </g>
</svg>
